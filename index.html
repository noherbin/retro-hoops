<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Hoops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Retro Hoops: a pixel-art 5-on-5 basketball game with a full franchise mode.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-screen app, fixed header per screen, panels as titled pixel frames. One deliberate dark arcade look. */
:root {
  --navy: #1c2541; --navy-d: #121a30; --navy-l: #2c3a63; --navy-ll: #3b4b7a;
  --cream: #f2e8cf; --cream-d: #d9ccab; --orange: #e07a2e; --orange-d: #a9531c;
  --green: #6a8d5f; --green-l: #8fb27f; --red: #c8462b; --yellow: #f2c14e; --ink: #0b1020;
  --f-display: 'Silkscreen', 'Courier New', monospace;
  --f-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--navy); color: var(--cream); font-family: var(--f-body); font-size: 16px; overflow: hidden; -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy-d); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { position: relative; height: 100%; width: 100%; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.screen[hidden] { display: none !important; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 12px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.bg-dots { background-color: var(--navy); background-image: radial-gradient(var(--navy-l) 1px, transparent 1.2px); background-size: 12px 12px; }

/* header */
.hdr { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--navy-d); border-bottom: 3px solid var(--ink); flex-wrap: wrap; }
.hdr h1 { flex: 1; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(16px, 3.2vw, 30px); margin: 0; letter-spacing: 2px; text-wrap: balance; min-width: 0; }
.hdr .stars3 { font-size: .8em; letter-spacing: -2px; }
.s-o { color: var(--orange); } .s-c { color: var(--cream); } .s-g { color: var(--green-l); }
.pill { font-family: var(--f-display); border: 3px solid var(--cream); padding: 3px 10px; background: var(--navy); white-space: nowrap; font-size: 14px; }
.pill.cash { color: var(--yellow); }

/* buttons */
.btn { font-family: var(--f-display); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; background: var(--navy-l); border: 3px solid var(--cream); color: var(--cream); padding: 10px 16px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); position: relative; transition: transform .05s; line-height: 1.15; }
.btn:hover { background: var(--navy-ll); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .tile:focus-visible, .pcard:focus-visible, .seg button:focus-visible, .tab:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 3px; }
.btn.primary { background: var(--orange); color: var(--ink); }
.btn.primary:hover { background: #ef8b3e; }
.btn.good { background: var(--green); }
.btn.danger { background: var(--red); }
.btn.sm { font-size: 12px; padding: 6px 10px; border-width: 2px; box-shadow: 0 3px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn .sub { display: block; font-family: var(--f-body); font-size: 12px; text-transform: none; letter-spacing: 0; opacity: .85; margin-top: 2px; }
.ibtn { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 0; }

/* panels */
fieldset.panel { border: 3px solid var(--cream); margin: 0; padding: 14px 16px 16px; background: rgba(18, 26, 48, .72); box-shadow: 5px 5px 0 var(--ink); min-width: 0; }
fieldset.panel > legend { font-family: var(--f-display); font-weight: 700; letter-spacing: 2px; padding: 0 8px; font-size: 15px; text-transform: uppercase; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.muted { color: var(--cream-d); opacity: .85; }
.tiny { font-size: 13px; }
.disp { font-family: var(--f-display); letter-spacing: 1px; }
h2.disp { margin: 0; font-size: 20px; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; font-family: var(--f-display); }

/* bars */
.bar { height: 16px; background: var(--ink); border: 2px solid var(--cream); position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--yellow); }
.bar.green > i { background: var(--green-l); } .bar.orange > i { background: var(--orange); }
.segbar { display: flex; gap: 3px; }
.segbar i { flex: 1; height: 16px; background: var(--ink); border: 2px solid var(--navy-ll); }
.segbar i.on { background: var(--yellow); border-color: var(--cream); }

/* tabs & segmented */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font-family: var(--f-display); font-size: 13px; padding: 8px 12px; border: 3px solid var(--cream); background: var(--navy-d); cursor: pointer; text-transform: uppercase; color: var(--cream-d); }
.tab.on { background: var(--cream); color: var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--cream); border: 3px solid var(--cream); width: fit-content; max-width: 100%; }
.seg button { flex: 1 1 auto; font-family: var(--f-display); font-size: 13px; padding: 8px 12px; border: 0; background: var(--navy-d); cursor: pointer; color: var(--cream-d); white-space: nowrap; }
@media (max-width: 520px) { .seg button { font-size: 11px; padding: 8px 7px; } }
.seg button.on { background: var(--orange); color: var(--ink); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th { font-family: var(--f-display); font-size: 12px; text-align: left; color: var(--cream-d); padding: 6px 8px; border-bottom: 2px solid var(--cream); white-space: nowrap; letter-spacing: 1px; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--navy-l); white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.me td { background: rgba(224, 122, 46, .16); }
.tbl tr.cut td { border-bottom: 3px dashed var(--orange); }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--navy-l); }
.pos { font-family: var(--f-display); font-size: 12px; padding: 1px 5px; color: var(--ink); }
.pos-PG, .pos-SG { background: #7fb2d1; } .pos-SF { background: var(--green-l); } .pos-PF, .pos-C { background: #e09a68; }
.tm { display: inline-flex; align-items: center; gap: 8px; }
.tm img { width: 24px; height: 24px; }
.w { color: var(--green-l); } .l { color: #e58a74; }
.up { color: var(--green-l); } .dn { color: #e58a74; }

/* player cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.pcard { border: 3px solid var(--cream); background: var(--navy-d); cursor: pointer; box-shadow: 4px 4px 0 var(--ink); display: flex; flex-direction: column; position: relative; text-align: left; padding: 0; }
.pcard:hover { filter: brightness(1.12); border-color: var(--yellow); }
.pcard .top { position: relative; height: 92px; display: grid; place-items: end center; overflow: hidden; }
.pcard .top img { width: 72px; height: 72px; }
.pcard .badge { position: absolute; top: 4px; left: 6px; font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--cream); text-shadow: 2px 2px 0 var(--ink); }
.pcard .ovr { position: absolute; top: 4px; right: 6px; font-family: var(--f-display); font-size: 16px; background: var(--ink); padding: 0 4px; }
.pcard .top img.mood { position: absolute; bottom: 4px; right: 6px; width: 18px; height: 18px; }
.pcard .st-tag { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-display); font-size: 11px; background: var(--yellow); color: var(--ink); padding: 0 4px; }
.pcard .bot { background: #3e4250; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 3px; align-items: center; border-top: 3px solid var(--ink); }
.pcard .nm { font-family: var(--f-display); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pcard .sal { font-family: var(--f-display); font-size: 13px; color: var(--cream-d); }
.pcard.sel { outline: 4px solid var(--yellow); outline-offset: 2px; }
.starsimg { display: inline-flex; gap: 1px; vertical-align: middle; }
.starsimg img { width: 16px; height: 16px; }

/* team tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .tile { padding: 8px; gap: 8px; } .tile > img { width: 36px; height: 36px; } .tile .tn { font-size: 12px; } .tile .ts { font-size: 11px; } }
.tile { border: 3px solid var(--cream); background: var(--navy-d); padding: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; text-align: left; box-shadow: 4px 4px 0 var(--ink); }
.tile > img { width: 48px; height: 48px; flex: none; }
.tile.on { background: var(--orange); color: var(--ink); }
.tile .tn { font-family: var(--f-display); font-size: 14px; line-height: 1.15; }
.tile .ts { font-size: 12px; opacity: .85; }

/* title */
#title { align-items: center; justify-content: center; }
#title canvas.bgc, #menu canvas.bgc { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18, 26, 48, .35), rgba(18, 26, 48, .78) 55%, rgba(11, 16, 32, .95)); }
.title-box { position: relative; text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { font-family: var(--f-display); font-weight: 700; font-size: clamp(42px, 10vw, 104px); line-height: .9; letter-spacing: 4px; color: var(--cream); text-shadow: 5px 5px 0 var(--orange-d), 9px 9px 0 var(--ink); margin: 0; }
.logo span { color: var(--orange); }
.logo-stars { font-size: clamp(16px, 3vw, 26px); letter-spacing: 6px; }
.blink { animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* main menu */
#menu .menu-body { position: relative; flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr); gap: 24px; align-items: center; max-width: 1080px; margin: 0 auto; width: 100%; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.teamcard { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.teamcard .em { width: 112px; height: 112px; filter: drop-shadow(5px 5px 0 var(--ink)); }
.teamcard .city { font-family: var(--f-display); font-size: 18px; color: var(--cream-d); letter-spacing: 2px; line-height: 1.2; margin-bottom: 4px; }
.teamcard .name { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; text-shadow: 4px 4px 0 var(--ink); }
.statline { display: flex; gap: 10px; flex-wrap: wrap; }
.statline .pill { font-size: 13px; }
.trophies { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; min-height: 40px; }
.trophies img { width: 30px; height: 40px; }
.menu-btns { display: flex; flex-direction: column; gap: 10px; }
.menu-btns .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.menu-btns .btn.primary { font-size: 20px; padding: 14px 16px; }
.wire { position: relative; background: var(--ink); border-top: 3px solid var(--orange); padding: 8px 0; white-space: nowrap; overflow: hidden; font-size: 14px; }
.wire .lbl { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); color: var(--ink); font-family: var(--f-display); padding: 8px 12px; z-index: 2; font-size: 13px; }
.wire .track { display: inline-block; padding-left: 100%; animation: wire 60s linear infinite; }
.wire .track span { margin-right: 48px; }
@keyframes wire { to { transform: translateX(-100%); } }

/* pregame */
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.vs-side { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.vs-side canvas { width: 168px; height: 192px; }
.vs-side > img { width: 150px; height: auto; }
.vs-side .bign { font-family: var(--f-display); font-weight: 700; font-size: clamp(18px, 3vw, 30px); line-height: 1; }
.vs-mid { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.vs-mid .vs { font-family: var(--f-display); font-size: 40px; color: var(--orange); text-shadow: 3px 3px 0 var(--ink); }
.rating-row { display: flex; gap: 8px; align-items: center; font-family: var(--f-display); font-size: 13px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 20px; font-size: 14px; }
.keys b, kbd { font-family: var(--f-display); font-size: 12px; border: 2px solid var(--cream); padding: 1px 6px; margin-right: 6px; background: var(--navy-d); font-weight: 400; }
.keys > div { display: flex; gap: 8px; align-items: flex-start; } .keys .kk { flex: none; display: flex; gap: 3px; } .keys .kk kbd { margin-right: 0; }

/* game */
#game { background: #070b16; }
.game-stage { position: absolute; inset: 0; display: grid; place-items: center; min-height: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
/* the court fills the screen; the canvas takes the screen's shape (see sizeCanvas) */
.g-frame { position: relative; width: 100%; height: 100%; }
#gcv { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
.g-ov { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; padding: 2px 4px; pointer-events: none; }
.g-btn { pointer-events: auto; width: var(--hb, 32px); height: var(--hb, 32px); padding: 0; display: grid; place-items: center; background: rgba(28, 37, 65, .85); border: 2px solid var(--cream-d); color: var(--cream); cursor: pointer; }
.g-btn:hover { border-color: var(--yellow); }
.g-btn:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 2px; }
.g-btn svg { width: 55%; height: 55%; fill: currentColor; }
.g-btn[hidden] { display: none; }
.gbar { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--navy-d); font-size: 13px; }
.gbar { flex-wrap: wrap; }
.gbar-mid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.legend { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transition: opacity .8s; background: rgba(11, 16, 32, .78) !important; border-top: 0 !important; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--navy-d); border-top: 3px solid var(--ink); font-family: var(--f-display); font-size: 12px; color: var(--cream-d); }
.legend[hidden] { display: none !important; }
.lg { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; opacity: .5; transition: opacity .15s; }
.lg kbd { margin-right: 0; }
.lg kbd:last-of-type { margin-right: 5px; }
.lg.hot { opacity: 1; color: var(--yellow); }
.lg.hot kbd { border-color: var(--yellow); }
.gbar .hint { color: var(--cream-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.touch { position: absolute; inset: auto 0 0 0; height: 46%; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.touch[hidden] { display: none !important; }
.joy { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 18px; width: 128px; height: 128px; border: 3px solid rgba(242, 232, 207, .55); border-radius: 50%; background: rgba(11, 16, 32, .35); pointer-events: auto; touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(242, 232, 207, .75); border: 3px solid var(--ink); }
.tbtns { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 14px; display: grid; grid-template-columns: repeat(3, 62px); gap: 8px; pointer-events: auto; touch-action: none; }
.tbtns button { height: 54px; border: 3px solid var(--cream); background: rgba(28, 37, 65, .78); font-family: var(--f-display); font-size: 11px; color: var(--cream); touch-action: none; }
.tbtns button.big { background: rgba(224, 122, 46, .9); color: var(--ink); grid-column: span 1; }
.tbtns button.act { background: var(--yellow); color: var(--ink); }

.rotate-hint { display: none; position: absolute; top: 12px; left: 16px; right: 16px; text-align: center; font-size: 12px; color: var(--cream-d); margin: 0; }
@media (orientation: portrait) and (pointer: coarse) { .rotate-hint { display: block; } }

/* modal & toast */
.modal { position: fixed; inset: 0; background: rgba(7, 11, 22, .78); display: grid; place-items: center; z-index: 50; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.modal-box { background: var(--navy); border: 3px solid var(--cream); box-shadow: 8px 8px 0 var(--ink); width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-box.sm { width: min(440px, 100%); }
.modal-box h3 { font-family: var(--f-display); margin: 0; font-size: 22px; letter-spacing: 1px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--cream); color: var(--ink); font-family: var(--f-display); padding: 10px 16px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); z-index: 80; max-width: calc(100% - 32px); text-align: center; font-size: 14px; }
.toast.bad { background: var(--red); color: var(--cream); }

/* player detail */
.pd-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.pd-head > img { width: 96px; height: 96px; border: 3px solid var(--cream); }
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; }
.attr { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: 8px; font-size: 14px; }
.attr .bar { height: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { border: 2px solid var(--navy-ll); padding: 6px 8px; background: var(--navy-d); }
.kv b { display: block; font-family: var(--f-display); font-size: 11px; color: var(--cream-d); font-weight: 400; letter-spacing: 1px; }
.kv span { font-family: var(--f-display); font-size: 16px; }

/* bracket */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(190px, 1fr)); gap: 18px; align-items: stretch; min-width: 620px; }
.bcol { display: flex; flex-direction: column; gap: 14px; }
.bcol .series { margin-block: auto; } /* headings stay level at the top; series spread out underneath */
@media (max-width: 560px) { .bracket { grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 16px; } .bcol { gap: 8px; } .bcol .series { margin-block: 0; } }
.bcol h4 { margin: 0; font-family: var(--f-display); font-size: 12px; color: var(--orange); letter-spacing: 1px; }
.series { border: 2px solid var(--cream); background: var(--navy-d); }
.series .sr { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; gap: 8px; min-height: 34px; }
.series .sr + .sr { border-top: 1px solid var(--navy-ll); }
.series .sr.win { background: rgba(106, 141, 95, .35); }
.series .sr.me { color: var(--yellow); }

.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-family: var(--f-display); font-size: 11px; padding: 4px 8px; border: 2px solid var(--navy-ll); color: var(--cream-d); }
.steps span.on { border-color: var(--orange); background: var(--orange); color: var(--ink); }
.steps span.done { border-color: var(--green); color: var(--green-l); }
.award { display: flex; gap: 12px; align-items: center; }
.award img { width: 64px; height: 64px; border: 3px solid var(--cream); }
.cap-row { display: flex; flex-wrap: wrap; justify-content: space-between; font-family: var(--f-display); font-size: 13px; margin-bottom: 6px; gap: 4px 12px; }
.cap-row > span { white-space: nowrap; }
.fac { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.list { display: flex; flex-direction: column; gap: 8px; }

const SAVE_KEY = 'retrohoops_save_v1';

const DIFF_NAMES = ['ROOKIE', 'PRO', 'ALL-STAR', 'LEGEND'];

/* ---------- rating scale ----------
   Ratings are stored and shown on a 2K-style scale (stars in the 90s, starters in the 80s, bench in the 70s).
   The on-court engine was tuned on a wider, lower scale, so it reads ratings through toEngine(). */
const toEngine = r => (r - 30) / 0.75;
const to2K = g => g * 0.75 + 30;
const KEY_ATTRS = { PG: ['pas', 'dri', 'thr', 'sht', 'spd', 'stl'], SG: ['sht', 'thr', 'dri', 'spd', 'def', 'stl'], SF: ['sht', 'thr', 'def', 'dri', 'spd', 'reb'], PF: ['reb', 'def', 'sht', 'blk', 'spd', 'dri'], C: ['reb', 'blk', 'def', 'sht', 'pas', 'sta'] };
/* ---------- players ---------- */
function calcOvr(p) {
  // like 2K: a position-weighted average, pulled toward the player's best skills for his position
  const w = RH.POS_WEIGHT[p.pos]; let s = 0, t = 0;
  for (const a of RH.ATTRS) { s += p.r[a] * w[a]; t += w[a]; }
  const best = KEY_ATTRS[p.pos].map(a => p.r[a]).sort((a, b) => b - a).slice(0, 4);
  return clamp(Math.round(0.55 * (s / t) + 0.45 * best.reduce((a, b) => a + b, 0) / 4), 25, 99);
}
function salaryFor(ovr, age) {
  let m = Math.pow(clamp((toEngine(ovr) - 50) / 45, 0, 1.15), 2.1) * 36;
  if (age >= 31) m *= 0.85; if (age >= 34) m *= 0.75;
  return Math.max(0.9, Math.round(m * 10) / 10);
}
function genPlayer(o = {}) {
  const pos = o.pos || pick(RH.POSITIONS);
  const age = o.age || randi(21, 33);
  const target = o.ovr || randi(70, 86);
  const d = RH.POS_DELTA[pos];
  const p = {
    id: uid('p'), first: pick(RH.FIRST), last: pick(RH.LAST), pos, age,
    hgt: randi(...RH.HEIGHTS[pos]), r: {}, pot: 0, salary: 1, years: randi(1, 4), xp: 0, level: 1,
    morale: randi(60, 85), exp: Math.max(0, age - randi(19, 22)), skin: pick(RH.SKIN), hair: pick(RH.HAIR),
    hairStyle: randi(0, 5), num: randi(0, 55), tid: o.tid ?? null, work: clamp(1 + gauss() * 0.25, 0.55, 1.5),
    stats: blankStats(), career: blankStats(), awards: [], rookie: false
  };
  for (const a of RH.ATTRS) p.r[a] = clamp(Math.round(target + d[a] + gauss() * 5), 25, 99);
  // nudge until overall ≈ target
  for (let k = 0; k < 4; k++) { const diff = target - calcOvr(p); if (!diff) break; for (const a of RH.ATTRS) p.r[a] = clamp(p.r[a] + diff, 25, 99); }
  p.ovr = calcOvr(p);
  const young = Math.max(0, 25 - age);
  p.pot = clamp(Math.round(p.ovr + (o.potBonus ?? (young * rand(0.9, 2.6) + rand(0, 3)))), p.ovr, 99);
  p.salary = o.salary ?? salaryFor(p.ovr, age);

}
function blankStats() { return { gp: 0, min: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0, to: 0 }; }
function P(id) { const n = (RH.netPlayers && RH.netPlayers[id]) || (RH.extPlayers && RH.extPlayers[id]); return n || (S ? S.players[id] : undefined); } // online games bring their own players
function T(tid) { return S.teams[tid]; }
function effR(p, a) { return clamp(Math.round(toEngine(p.r[a] + (p.morale - 60) / 18.5)), 15, 99); } // engine-scale value used by gameplay
function stars(ovr) { return clamp(Math.round((ovr - 45) / 5) / 2, 0.5, 5); } // 95+ = 5, 90 = 4.5, 85 = 4, 80 = 3.5, 75 = 3, 70 = 2.5
function fullName(p) { return p.first + ' ' + p.last; }
function shortName(p) { return p.first[0] + '.' + p.last; }

/* ---------- teams ---------- */
function teamPayroll(t) { return t.roster.reduce((s, id) => s + P(id).salary, 0); }
function teamCap(t) { return BASE_CAP + (t.capBonus || 0); }
function capRoom(t) { return teamCap(t) - teamPayroll(t); }
function rotation(t) {
  const st = t.starters.map(P);
  const bench = t.roster.filter(id => !t.starters.includes(id)).map(P).sort((a, b) => b.ovr - a.ovr);
  return { starters: st, bench };
}
function playerOff(p) { const v = ['sht', 'thr', 'pas', 'dri', 'spd'].map(a => p.r[a]).sort((a, b) => b - a); return 0.5 * p.ovr + 0.5 * (v[0] + v[1] + v[2]) / 3; }
function playerDef(p) { const v = ['def', 'stl', 'blk', 'reb'].map(a => p.r[a]).sort((a, b) => b - a); return 0.5 * p.ovr + 0.5 * (v[0] + v[1] + v[2]) / 3; }
const TEAM_W = [0.23, 0.18, 0.15, 0.13, 0.11, 0.08, 0.07, 0.05]; // best player counts most, 8-man rotation
function teamRatings(t) {
  const ps = t.roster.map(P).filter(Boolean).sort((a, b) => b.ovr - a.ovr).slice(0, 8);
  const wsum = TEAM_W.slice(0, ps.length).reduce((a, b) => a + b, 0) || 1;
  const agg = f => ps.reduce((x, p, i) => x + TEAM_W[i] * f(p), 0) / wsum;
  return { ovr: Math.round(agg(p => p.ovr)), off: Math.round(agg(playerOff)), def: Math.round(agg(playerDef)) };
}
// Team stars rate a team against the rest of the league, so they always track who is actually good
// (a league-average team is 3-3.5 stars, the class of the league 5, the worst 1-1.5).
function teamStars(v, kind = 'ovr') {
  if (!S || !S.teams) return clamp(Math.floor((v - 73) / 2) / 2 + 1, 1, 5);
  const vals = S.teams.map(t => teamRatings(t)[kind]);
  const m = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - m) * (b - m), 0) / vals.length);
  return clamp(Math.round((3.25 + (v - m) / Math.max(2.5, sd) * 1.15) * 2) / 2, 1, 5);
}
function autoLineup(t) {
  const ps = t.roster.map(P).sort((a, b) => b.ovr - a.ovr);
  const starters = [];
  for (const pos of RH.POSITIONS) { const c = ps.find(p => p.pos === pos && !starters.includes(p.id)); if (c) starters.push(c.id); }
  for (const p of ps) { if (starters.length >= 5) break; if (!starters.includes(p.id)) starters.push(p.id); }
  // replace a starter if a bench player is much better
  for (let i = 0; i < starters.length; i++) {
    const s = P(starters[i]);
    const better = ps.find(p => !starters.includes(p.id) && p.ovr >= s.ovr + 5);
    if (better) starters[i] = better.id;
  }
  t.starters = starters.slice(0, 5);
}
function sortStartersByPos(ids) {
  const order = { PG: 0, SG: 1, SF: 2, PF: 3, C: 4 };
  return ids.slice().sort((a, b) => order[P(a).pos] - order[P(b).pos]);
}

/* ---------- league creation ---------- */
function createLeague(userTid, settings, temp) {
  S = { v: 1, ratingScale: '2k', settings: Object.assign(defaultSettings(), settings || {}), year: 2026, userTid, teams: [], players: {}, fa: [], schedule: [], week: 0, phase: 'regular', playoffs: null, offStep: null, draft: null, picks: [], history: [], news: [], trainUsed: 0, dinnerWeek: -1, lastGame: null, seasonNo: 1 };
  RH.TEAMS_DEF.forEach((d, i) => {
    const t = Object.assign({ id: i, roster: [], starters: [], w: 0, l: 0, pf: 0, pa: 0, cash: 12, hype: 50, capBonus: 0, champs: [], streak: 0, facilities: { arena: 1, training: 1, medical: 1, scouting: 1 } }, d);
    if (i !== userTid) { t.facilities = { arena: randi(1, 5), training: randi(1, 5), medical: randi(1, 5), scouting: randi(1, 5) }; }
    S.teams.push(t);
  });
  const tiers = shuffle([97, 95, 94, 93, 92, 91, 90, 90, 89, 88, 88, 87, 86, 85, 84, 83]); // team strength = level of its best player
  S.teams.forEach((t, i) => {
    const top = tiers[i];
    const plan = [['PG', 0], ['SG', 0], ['SF', 0], ['PF', 0], ['C', 0], ['PG', 1], ['SG', 1], ['SF', 1], ['PF', 1], ['C', 1], [pick(['PG', 'SG']), 2], [pick(['SF', 'PF', 'C']), 2]];
    const starIdx = randi(0, 4);
    plan.forEach(([pos, tier], k) => {
      let ovr = tier === 0 ? top - randi(4, 11) : tier === 1 ? top - randi(11, 17) : top - randi(15, 22);
      if (k === starIdx) ovr = Math.min(98, top + randi(0, 3));
      const p = genPlayer({ pos, ovr, tid: t.id, age: tier === 2 ? randi(20, 24) : randi(21, 34) });
      S.players[p.id] = p; t.roster.push(p.id);
    });
    autoLineup(t);
    trimPayroll(t);
  });
  for (let i = 0; i < 24; i++) { const p = genPlayer({ ovr: randi(68, 79) }); p.years = 0; S.players[p.id] = p; S.fa.push(p.id); }
  for (let y = S.year; y <= S.year + 1; y++) for (let r = 1; r <= 2; r++) S.teams.forEach(t => S.picks.push({ year: y, round: r, orig: t.id, owner: t.id }));
  S.schedule = makeSchedule(S.settings.seasonGames);
  news(`Welcome to the ${S.year} season! The ${T(userTid).city} ${T(userTid).name} are your team.`);
  if (!temp) save(); else S.temp = true;
  return S;
}
function adoptLeague(userTid, settings) {
  delete S.temp; S.userTid = userTid; Object.assign(S.settings, settings || {});
  S.teams.forEach(t => {
    if (t.id === userTid) { t.facilities = { arena: 1, training: 1, medical: 1, scouting: 1 }; t.cash = 12; }
    else if (Object.values(t.facilities).every(v => v === 1)) t.facilities = { arena: randi(1, 5), training: randi(1, 5), medical: randi(1, 5), scouting: randi(1, 5) };
  });
  S.schedule = makeSchedule(S.settings.seasonGames); S.week = 0; S.news = [];
  news(`Welcome to the ${S.year} season! The ${T(userTid).city} ${T(userTid).name} are your team.`);
  save();
}
function trimPayroll(t) {
  // keep the generated league under the cap by trimming bench salaries
  let guard = 0;
  while (teamPayroll(t) > teamCap(t) - 4 && guard++ < 40) {
    const bench = t.roster.map(P).filter(p => !t.starters.includes(p.id)).sort((a, b) => b.salary - a.salary);
    const tgt = bench[0] && bench[0].salary > 2 ? bench[0] : t.roster.map(P).sort((a, b) => b.salary - a.salary)[0];
    tgt.salary = Math.round(tgt.salary * 0.8 * 10) / 10;

}
function makeSchedule(n) {
  const ids = S.teams.map(t => t.id), rounds = [];
  const arr = ids.slice(), N = arr.length;
  for (let r = 0; r < N - 1; r++) {
    const wk = [];
    for (let i = 0; i < N / 2; i++) { const a = arr[i], b = arr[N - 1 - i]; wk.push((r + i) % 2 ? { h: a, a: b, res: null } : { h: b, a: a, res: null }); }
    rounds.push(wk); arr.splice(1, 0, arr.pop());
  }
  shuffle(rounds);
  let out = rounds.slice();
  if (n > 15) out = out.concat(rounds.map(wk => wk.map(g => ({ h: g.a, a: g.h, res: null }))));
  return out.slice(0, n);
}
function news(msg) { S.news.unshift({ y: S.year, w: S.week, msg }); S.news = S.news.slice(0, 40); }

/* ---------- save / load ---------- */
function save() { if (S && S.temp) return false; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function load() {

    if (S.ratingScale !== '2k') { for (const p of Object.values(S.players)) { for (const a of RH.ATTRS) p.r[a] = clamp(Math.round(to2K(p.r[a])), 25, 99); const pot = clamp(Math.round(to2K(p.pot)), 25, 99); p.ovr = calcOvr(p); p.pot = Math.max(p.ovr, pot); } S.ratingScale = '2k'; save(); } return S; } catch (e) { return null; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } S = null; }

/* ---------- quick sim engine ---------- */
function simGame(hTid, aTid, opts = {}) {
  const qlen = S.settings.qlen, teams = [T(hTid), T(aTid)];
  const lineups = teams.map(t => {
    const { starters, bench } = rotation(t);
    const sh = [0.8, 0.8, 0.8, 0.8, 0.8], bh = [0.38, 0.3, 0.22, 0.1];
    return [...starters.map((p, i) => ({ p, s: sh[i] })), ...bench.slice(0, 4).map((p, i) => ({ p, s: bh[i] }))];
  });
  const box = {}; lineups.flat().forEach(({ p, s }) => { box[p.id] = Object.assign(blankStats(), { min: Math.round(s * qlen * 4 * 10) / 10 }); });
  const avg = (lu, a) => lu.reduce((x, { p, s }) => x + effR(p, a) * s, 0) / lu.reduce((x, { s }) => x + s, 0);
  const wpick = (lu, f) => { const ws = lu.map(o => Math.max(0.01, f(o))); let r = Math.random() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return lu[i].p; } return lu[0].p; };
  const score = [0, 0];
  const diffAdj = [0, 0];
  if (opts.userSide != null) { const d = S.settings.difficulty; diffAdj[1 - opts.userSide] = [-0.04, 0, 0.025, 0.05][d]; }
  const posses = (o, n) => {
    const off = lineups[o], de = lineups[1 - o], t = teams[o];
    const dDef = avg(de, 'def'), dStl = avg(de, 'stl'), dBlk = avg(de, 'blk'), oReb = avg(off, 'reb'), dReb = avg(de, 'reb'), oPas = avg(off, 'pas');
    const threeBase = { three: 0.46, motion: 0.36, drive: 0.24, defense: 0.31 }[t.style];
    for (let i = 0; i < n; i++) {
      let alive = true, tries = 0;
      const toP = 0.12 - (oPas - 65) * 0.0012 + (dStl - 60) * 0.0014 + (teams[1 - o].style === 'defense' ? 0.02 : 0);
      if (chance(toP)) { const sh = wpick(off, x => x.s); box[sh.id].to++; const st = wpick(de, x => x.s * effR(x.p, 'stl')); box[st.id].stl++; continue; }
      while (alive && tries++ < 3) {
        const sh = wpick(off, x => x.s * Math.pow(Math.max(5, toEngine(x.p.ovr) - 40), 1.6) * (effR(x.p, 'sht') + effR(x.p, 'thr') * 0.5) / 100);
        const r3 = clamp(threeBase * Math.pow(effR(sh, 'thr') / 72, 2), 0.02, 0.62);
        const roll = Math.random(); const type = roll < r3 ? 3 : roll < r3 + 0.3 ? 'mid' : 'rim';
        let pm = type === 3 ? 0.30 + (effR(sh, 'thr') - 70) * 0.0055 : type === 'mid' ? 0.38 + (effR(sh, 'sht') - 70) * 0.005 : 0.56 + (effR(sh, 'sht') + effR(sh, 'dri') - 140) * 0.0025;
        pm -= (dDef - 65) * 0.0045; if (o === 0) pm += 0.015; pm += diffAdj[o];
        const pts = type === 3 ? 3 : 2;
        const fouled = chance(type === 'rim' ? 0.16 : 0.05);
        box[sh.id].fga++; if (pts === 3) box[sh.id].tpa++;
        const made = chance(clamp(pm, 0.12, 0.8));
        const ftp = clamp(0.55 + effR(sh, 'sht') * 0.0035, 0.5, 0.93);
        if (made) {
          box[sh.id].fgm++; if (pts === 3) box[sh.id].tpm++; box[sh.id].pts += pts; score[o] += pts;
          if (chance(0.58)) { const as = wpick(off.filter(x => x.p !== sh), x => x.s * effR(x.p, 'pas')); box[as.id].ast++; }
          if (fouled) { box[sh.id].fta++; if (chance(ftp)) { box[sh.id].ftm++; box[sh.id].pts++; score[o]++; } }
          alive = false;
        } else {
          if (fouled) { for (let k = 0; k < pts; k++) { box[sh.id].fta++; if (chance(ftp)) { box[sh.id].ftm++; box[sh.id].pts++; score[o]++; } } alive = false; break; }
          if (chance(0.07 * dBlk / 60)) { const bl = wpick(de, x => x.s * Math.pow(effR(x.p, 'blk'), 2)); box[bl.id].blk++; }
          const orb = chance(clamp(0.24 + (oReb - dReb) * 0.004, 0.1, 0.4));
          const reb = orb ? wpick(off, x => x.s * Math.pow(effR(x.p, 'reb'), 2)) : wpick(de, x => x.s * Math.pow(effR(x.p, 'reb'), 2));
          box[reb.id].reb++;
          alive = orb;
        }
      }
    }

/* ---------- every clip the booth could ask for (used to record the voice pack) ---------- */
function boothManifest(teams, names, maxScore = 140, maxStat = 80) {
  const out = {}, add = (key, text, voice) => { if (!out[key]) out[key] = { text, voice }; };
  const domains = { theTeam: teams.map(t => 'the ' + t.name), qth: ['first', 'second', 'third'], pts: PTS_STEPS };
  const expand = (tpl, color) => {
    const smalls = [...new Set([...tpl.matchAll(/\{(\w+)\}/g)].map(m => m[1]).filter(k => !TPL_BIG[k]))];
    let combos = [{}];
    for (const k of smalls) {
      if (k === 'theHome' || k === 'homeCity') { if (!combos[0].homeCity) combos = combos.flatMap(c => teams.map(t => Object.assign({}, c, { theHome: 'the ' + t.name, homeCity: t.city }))); continue; }
      combos = combos.flatMap(c => (domains[k] || ['']).map(x => Object.assign({}, c, { [k]: x })));
    }
    for (const c of combos) for (const key of tplKeys(tpl, Object.assign({ name: 'X', num: 0, num2: 0, numto: 0 }, c), color)) if (/^[pc]:/.test(key)) add(key, key.slice(2), color ? 'c' : 'p');
  };
  for (const L of Object.values(BOOTH)) for (const l of L.lines) if (l !== '{tpl}' && !L.keys) expand(l, !!L.color);
  for (const t of Object.values(STATS)) expand(t, true);
  for (const n of names) { add('pn:' + n, n, 'p'); add('cn:' + n, n, 'c'); }
  for (let i = 0; i <= maxScore; i++) { add('p#:' + i, String(i), 'p'); add('pt:' + i, i + ' to', 'p'); }
  for (let i = 0; i <= maxStat; i++) add('c#:' + i, String(i), 'c');
  for (const k of ['x:green1', 'x:green2', 'x:green3']) add(k, 'Green!', 'p');
  return out;
}

'use strict';
/* ============ RETRO HOOPS — online multiplayer ============
   One player hosts: their game runs the whole simulation, with the friend's team driven by the friend's inputs.
   The friend's screen draws the host's game from ~20 snapshots a second (smoothed), and judges its own shot
   timing locally so lag never costs a green. Connections: Claude's live room when the game is opened from the
   Claude artifact, free peer-to-peer (PeerJS / WebRTC) anywhere else, and a same-browser channel for testing. */
const NET = (() => {
  const V = 1;
  const CODE_CH = 'abcdefghjkmnpqrstuvwxyz23456789';
  const POSES = ['stand', 'run', 'dribble', 'shoot', 'block', 'jump', 'defend', 'celebrate', 'fall', 'photo'];
  const MSTATES = ['intro', 'tipoff', 'live', 'dead', 'ft', 'qbreak', 'half', 'final'];
  const BSTATES = ['dead', 'held', 'pass', 'shot', 'loose', 'through', 'tip'];
  const FTPH = ['wait', 'ready', 'meter', 'flight', 'done'];
  const SOUNDS = ['cheer', 'aww', 'boo', 'hoot', 'chant', 'applause', 'whistle', 'subWhistle', 'rim', 'swish', 'steal', 'shook', 'ooh', 'bounce', 'rimTick', 'pass', 'move', 'dunk', 'buzzer', 'block', 'ankles'];
  const PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  const r1 = v => Math.round(v * 10) / 10;
  const newCode = () => Array.from({ length: 5 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
  const cleanCode = c => String(c || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);

  /* ---------- teams travel as compact payloads (both screens rebuild identical players) ---------- */
  function teamPayload(t) {
    const st = RH.sortStartersByPos(t.starters).map(RH.P);
    const bench = t.roster.filter(id => !t.starters.includes(id)).map(RH.P).sort((a, b) => b.ovr - a.ovr).slice(0, 7);
    return { t: [t.city, t.name, t.abbr, t.c1, t.c2, t.style, t.shape], p: [...st, ...bench].map(p => [p.first, p.last, p.pos, p.hgt, p.skin, p.hair, p.hairStyle, p.num, Math.round(p.morale), ...RH.ATTRS.map(a => p.r[a])]) };
  }
  function buildTeam(pl, prefix) {
    const [city, name, abbr, c1, c2, style, shape] = pl.t;
    const ids = [];
    RH.netPlayers = RH.netPlayers || {};
    pl.p.slice(0, 12).forEach((a, i) => {
      const id = prefix + i, r = {};
      RH.ATTRS.forEach((k, j) => r[k] = Math.max(25, Math.min(99, +a[9 + j] || 60)));
      const p = { id, first: String(a[0]).slice(0, 16), last: String(a[1]).slice(0, 18), pos: RH.POSITIONS.includes(a[2]) ? a[2] : 'SF', hgt: +a[3] || 78, skin: String(a[4]), hair: String(a[5]), hairStyle: (+a[6] || 0) % 6, num: +a[7] || 0, morale: Math.max(5, Math.min(100, +a[8] || 70)), r, age: 26, exp: 3, level: 1, xp: 0, stats: RH.blankStats(), career: RH.blankStats(), awards: [], pot: 0, tid: null };
      p.ovr = RH.calcOvr(p); p.pot = p.ovr;
      RH.netPlayers[id] = p; ids.push(id);
    });
    return { id: prefix, city: String(city).slice(0, 20), name: String(name).slice(0, 20), abbr: String(abbr).slice(0, 4), c1: String(c1), c2: String(c2), style: ['three', 'drive', 'defense', 'motion'].includes(style) ? style : 'motion', shape: String(shape), roster: ids, starters: ids.slice(0, 5), facilities: { training: 1, medical: 2, arena: 2, scouting: 1 }, w: 0, l: 0 };
  }

  /* ---------- connections: same interface for Claude rooms, PeerJS and the test channel ---------- */
  function baseConn(kind, role, code) {
    const c = { kind, role, code, mine: {}, remote: null, status: 'connecting', error: null, _chg: [], _st: [], _pend: null, _flushT: 0 };
    c.onChange = fn => c._chg.push(fn);
    c.onStatus = fn => c._st.push(fn);

    if (RH.regularSeasonDone()) return { label: 'Start Playoffs', sub: 'The bracket is set', act: 'startplayoffs' };
    const g = RH.userGameThisWeek(); const opp = RH.T(g.h === s.userTid ? g.a : g.h);

  if (s.phase === 'playoffs') {

    if (g) { const opp = RH.T(g.h === s.userTid ? g.a : g.h); const ser = g.ref; const my = ser.a === s.userTid ? ser.wa : ser.wb, th = ser.a === s.userTid ? ser.wb : ser.wa; return { label: 'Play Playoff Game', sub: `${RH.ROUND_NAMES[s.playoffs.round]} · ${opp.name}${s.settings.bestOf > 1 ? ` · series ${my}-${th}` : ''}`, act: 'pregame' }; }

const POS_FULL = { PG: 'Point Guard', SG: 'Shooting Guard', SF: 'Small Forward', PF: 'Power Forward', C: 'Center' };
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  const born = (s ? s.year : 2026) - p.age, dob = `${String(1 + (sd >> 5) % 28).padStart(2, '0')} ${MONTHS[(sd >> 3) % 12]} ${born}`;
  const r = p.r, starOf = v => v >= 90 ? 5 : v >= 82 ? 4 : v >= 74 ? 3 : v >= 66 ? 2 : 1;
  const moves = starOf(r.dri), offHand = clamp(starOf(r.dri) - 1 + ((sd >> 7) % 3 === 0 ? 1 : 0), 1, 5), hand = sd % 9 === 0 ? 'LEFT' : 'RIGHT';
  const arch = [

    ['GLASS CLEANER', r.reb * 1.3 + r.def * 0.5 - (p.pos === 'PG' ? 40 : 0)], ['STRETCH BIG', (p.pos === 'PF' || p.pos === 'C') ? r.thr * 1.5 + r.reb * 0.5 : 0],
    ['TWO-WAY WING', (p.pos === 'SF' || p.pos === 'SG') ? (r.sht + r.def + r.thr) * 0.66 : 0]

function tradeHTML() {
  const s = S_(), u = uT();

  const myPicks = s.picks.filter(p => p.owner === u.id), thPicks = s.picks.filter(p => p.owner === o.id);
  const ev = RH.evalTrade(o.id, tr.give, tr.get, tr.givePk.map(i => s.picks[i]), tr.getPk.map(i => s.picks[i]));
  const plist = (team, sel, side) => team.roster.map(RH.P).sort((a, b) => b.ovr - a.ovr).map(p => `<label class="li" style="cursor:pointer"><input type="checkbox" class="check" id="tc-${p.id}" data-act="tradechk" data-side="${side}" data-id="${p.id}" ${sel.includes(p.id) ? 'checked' : ''}>${ptImg(p).replace('class="px pt"', 'class="px" width="32" height="32"')}<div class="grow"><b>${esc(RH.shortName(p))}</b> ${posTag(p.pos)}<div class="tiny muted">OVR ${p.ovr} · AGE ${p.age} · ${fmtMoney(p.salary)} × ${p.years}</div></div></label>`).join('');

  <div><p class="disp tiny" style="margin:0 0 8px">YOU GET · ${esc(o.name)} (${rec(o)})</p><div class="list">${plist(o, tr.get, 'get')}${klist(thPicks, tr.getPk, 'get')}</div></div></div>

/* ---------- keyboard ---------- */
const KEYMAP = { KeyC: 'move', KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'shoot', KeyE: 'pass', ShiftLeft: 'sprint', ShiftRight: 'sprint', KeyQ: 'switch', KeyF: 'steal', KeyR: 'block' };
const HELD = {};
function pushAxis() { if (!MATCH) return; let x = (HELD.right ? 1 : 0) - (HELD.left ? 1 : 0), y = (HELD.down ? 1 : 0) - (HELD.up ? 1 : 0); const L = Math.hypot(x, y); if (L) { x /= L; y /= L; } if (!JOY.active) MATCH.setAxis(x, y); }
window.addEventListener('keydown', e => {
  if (CUR === 'game' && MATCH) {
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (RH.NET.active()) { if ($('#modal')) closeModal(); else ACT.onmenu(); return; } if (MATCH.state === 'half') return; pauseGame(!MATCH.paused); return; }
    if (e.code === 'KeyM') { ACT.mute(); return; }
    const k = KEYMAP[e.code]; if (!k) return; e.preventDefault();
    if (MATCH.paused) return;

    else MATCH.keyDown(k);
    return;
  }
  if (e.code === 'Escape' && $('#modal')) { closeModal(); return; }
  if (CUR === 'online' && e.code === 'Enter' && document.activeElement && document.activeElement.id === 'oncode') { e.preventDefault(); ACT.onjoin(); return; }
  if (CUR === 'title' && (e.code === 'Enter' || e.code === 'Space') && !$('#modal')) { e.preventDefault(); RH.hasSave() ? ACT.continue() : ACT.newgame(); }
  if (CUR === 'postgame' && !$('#modal') && !e.repeat) {
    const ae = document.activeElement, onBtn = ae && ae.tagName === 'BUTTON' && ae !== document.body;
    if (UI.postStage === 'levelup' && (e.code === 'ArrowDown' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyS')) {
      e.preventDefault(); const q = RH.P(UI.lvPid); if (!q) return; const order = UPG_GROUPS.flatMap(g => g[1]).filter(a => q.r[a] < 99);
      const i = order.indexOf(UI.lvSel), d = (e.code === 'ArrowDown' || e.code === 'KeyS') ? 1 : -1; UI.lvSel = order[i < 0 ? 0 : (i + d + order.length) % order.length]; SFX.select(); renderLevelUp(); return;
    }
    if (UI.postStage === 'press' && UI.pressChoice == null && (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Numpad1' || e.code === 'Numpad2')) { ACT.presspick({ dataset: { i: e.code.endsWith('1') ? 0 : 1 } }); return; }
    if (e.code === 'Enter' && !onBtn) { const b = $('#postgame .btn.primary:not([disabled])'); if (b) { e.preventDefault(); b.click(); } return; }
  }
  if (CUR === 'menu' && !$('#modal') && !e.repeat) {
    if (e.code === 'Tab') { e.preventDefault(); UI.mTab = UI.mTab === 'club' ? 'hub' : 'club'; renderMenu(); }
    else if (e.code === 'Enter' && document.activeElement === document.body) { const n = nextAction(); if (ACT[n.act]) ACT[n.act](); }
    else if (e.code === 'KeyS' && nextAction().act === 'pregame') ACT.simgame();
  }
});
window.addEventListener('keyup', e => {
  if (CUR !== 'game' || !MATCH) return;
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault();
  if (['up', 'down', 'left', 'right'].includes(k)) { HELD[k] = false; pushAxis(); } else MATCH.keyUp(k);
});
window.addEventListener('blur', () => { for (const k in HELD) HELD[k] = false; if (MATCH) { pushAxis(); ['shoot', 'sprint'].forEach(k => MATCH.keyUp(k)); if (!RH.NET.active() && !MATCH.paused && MATCH.state !== 'half' && MATCH.state !== 'final') pauseGame(true); } });

/* ---------- touch ---------- */
const JOY = { active: false, id: null };
function bindTouch() {
  const joy = $('#joy'), knob = joy.querySelector('i');
  const upd = e => { const r = joy.getBoundingClientRect(); let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2); const L = Math.hypot(dx, dy); if (L > 1) { dx /= L; dy /= L; } knob.style.transform = `translate(${dx * 38}px, ${dy * 38}px)`; if (MATCH) MATCH.setAxis(Math.abs(dx) > 0.18 ? dx : 0, Math.abs(dy) > 0.18 ? dy : 0); };
  joy.addEventListener('pointerdown', e => { JOY.active = true; JOY.id = e.pointerId; joy.setPointerCapture(e.pointerId); upd(e); SFX.init(); });
  joy.addEventListener('pointermove', e => { if (JOY.active && e.pointerId === JOY.id) upd(e); });
  const end = e => { if (e.pointerId !== JOY.id) return; JOY.active = false; knob.style.transform = ''; if (MATCH) MATCH.setAxis(0, 0); };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  document.querySelectorAll('.tbtns button').forEach(b => {
    let k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); k = b.dataset.k; b.setPointerCapture(e.pointerId); b.classList.add('act'); SFX.init(); if (MATCH && !MATCH.paused) MATCH.keyDown(k); });
    const up = () => { b.classList.remove('act'); if (MATCH) MATCH.keyUp(k); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  });
}

/* ---------- online host in a background tab: browsers stop animation frames there, so keep simulating on a timer ---------- */
let BG = null;
function bgTick() { const t = performance.now(), dt = Math.min(0.05, (t - (BG ? BG.last : t)) / 1000); if (BG) BG.last = t; if (CUR === 'game' && MATCH && RH.NET.S.role === 'host' && RH.NET.S.phase === 'game') { RH.NET.preFrame(); MATCH.update(dt); RH.NET.postFrame(); } }
function startBg() {
  if (BG) return; BG = { last: performance.now(), stop: null };
  try { const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),33)'], { type: 'text/javascript' }))); w.onmessage = bgTick; BG.stop = () => w.terminate(); }
  catch (e) { const id = setInterval(bgTick, 33); BG.stop = () => clearInterval(id); }
}
function stopBg() { if (BG) { BG.stop && BG.stop(); BG = null; } }
document.addEventListener('visibilitychange', () => { if (document.hidden && RH.NET.S.role === 'host' && RH.NET.S.phase === 'game') startBg(); else stopBg(); });
/* ---------- main loop ---------- */
let LAST_T = performance.now(), WAS_LIVE = false;
function frame(t) {
  const dt = Math.min(0.05, (t - LAST_T) / 1000); LAST_T = t;
  try {
    const inGame = CUR === 'game' && !!MATCH;
    if (inGame) { RH.NET.preFrame(); const n = Math.max(1, MATCH.ffwd || 1); for (let i = 0; i < n && MATCH; i++) MATCH.update(dt); RH.NET.postFrame(); if (MATCH) { MATCH.render(GCTX); updateContextUI(); } } // career: the game fast-forwards while you sit
    else if (ATTRACT && (CUR === 'menu' || CUR === 'title')) { ATTRACT.m.update(dt); ATTRACT.m.render(ATTRACT.ctx); }
    // the crowd and the booth only while a game is on screen and running
    const live = inGame && !!MATCH && !MATCH.paused && !MATCH.over;
    if (live && MATCH.time > 25) { const lg = $('#legend'); if (lg && !lg.classList.contains('faded')) lg.classList.add('faded'); }
    SFX.setCrowdLive(live); if (WAS_LIVE && !live && !(MATCH && MATCH.over)) RH.VOICE.stop(); WAS_LIVE = live;
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function boot() {
  initIcons();
  window.addEventListener('resize', sizeCanvas);
  new ResizeObserver(sizeCanvas).observe(document.body);
  let mode = null; try { mode = localStorage.getItem('rh_mode'); } catch (e) { }
  if (mode === 'career' && RH.hasCareer()) RH.careerEnter(); // pick up where you left off
  else if (RH.load()) { applySettings(); renderMenu(); } else renderTitle();
  RH.VOICE.loadPack(); // the announcer's recorded voice, in the background
  requestAnimationFrame(frame);
}
RH.UI = UI; RH.boot = boot; RH.ACT = ACT; RH.getMatch = () => MATCH;

/* ---------- the turntable: your player in big pixels, spinning ---------- */
const TT = { t: 0, view: 0, spin: true, last: 0, running: false };
function ttStart() { if (TT.running) return; TT.running = true; requestAnimationFrame(ttLoop); }
function ttLoop(now) {
  const cv = document.getElementById('tt');
  if (!cv || CUR !== 'career') { TT.running = false; return; }
  const dt = Math.min(0.05, (now - (TT.last || now)) / 1000); TT.last = now; TT.t += dt;
  if (TT.spin && Math.floor(TT.t / 1.4) !== Math.floor((TT.t - dt) / 1.4)) TT.view = (TT.view + 1) % 4;
  const L = TT.src(); if (L) ttDraw(cv, L, TT.t, TT.view);
  requestAnimationFrame(ttLoop);
}
function ttDraw(cv, L, t, view) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height; x.imageSmoothingEnabled = false;
  x.fillStyle = '#121a30'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#1c2541'; for (let i = 0; i < W; i += 8) for (let j = 0; j < H; j += 8) if ((i + j) % 16 === 0) x.fillRect(i, j, 1, 1);
  x.fillStyle = '#c9965a'; x.fillRect(0, H - 34, W, 34); x.fillStyle = '#b8864d'; for (let i = 0; i < W; i += 18) x.fillRect(i, H - 34, 1, 34); x.fillStyle = PAL.cream; x.fillRect(0, H - 34, W, 2);
  x.fillStyle = 'rgba(40,20,8,.35)'; x.fillRect(W / 2 - 40, H - 22, 80, 6);
  const facing = [0, 1, 0, -1][view], back = view === 2, cyc = t % 4.2, sc = Math.floor(Math.min(W / 30, H / 42));
  let pose = 'stand', frame = 0, lift = 0;
  if (!back && cyc > 3.2) { pose = 'shoot'; lift = Math.round(Math.sin((cyc - 3.2) * Math.PI) * 6 * sc / 5); }
  else if (facing && cyc > 1) { pose = 'dribble'; }
  else if (cyc > 1.6 && cyc < 2.6) { pose = 'celebrate'; frame = Math.floor(t * 4) % 2; }
  const o = { x: W / 2, y: H - 18 - lift, scale: sc, facing, back, pose, frame, skin: L.skin, hair: L.hair, hairStyle: L.hairStyle, jersey: L.jersey, trim: L.trim, shorts: L.jersey, num: L.num, tall: L.tall, g: L.g };
  RH.drawSprite(x, o);
  if (pose === 'dribble') { const by = H - 18 - Math.round(Math.abs(Math.sin(t * 7)) * 9 * sc / 4) - 4 * sc; RH.drawBall(x, W / 2 + facing * 7 * sc, by, t * 6); }
  if (pose === 'shoot') RH.drawBall(x, W / 2 + facing * 2 * sc, H - 18 - lift - 30 * sc, 0);
}

  if (e.contests >= 3) good.push('Contested shots all night.');

  if (e.badShots >= 2) bad.push(`${e.badShots} forced shots early in the clock.`);

  cworkout: el => { const tid = +el.dataset.i, arch = Cc().me.arch; const k = { sharp: 'three', slash: 'finish', play: 'pass', lock: 'defense', big: 'finish', all: 'shoot' }[arch]; startDrill(k, { workout: tid }); },
  cinterviewt: el => { const tid = +el.dataset.i, D = Cc().draft, qi = (D.interviews * 2 + tid) % RH.INTERVIEW_Q.length, Q = RH.INTERVIEW_Q[qi], t = D.pro.teams[tid]; modal(`<h3>INTERVIEW: ${esc(tName(t).toUpperCase())}</h3><div class="pr-bubble"><b class="disp tiny">GENERAL MANAGER</b><p>${esc(Q.q)}</p></div><div class="list">${Q.a.map(([a], k) => `<button class="btn" data-act="civans" data-t="${tid}" data-q="${qi}" data-a="${k}">"${esc(a)}"</button>`).join('')}</div>`); },
  civans: el => { const a = RH.interviewAnswer(+el.dataset.t, +el.dataset.q, +el.dataset.a); closeModal(); toast(a[1] > 0 ? `They liked that (${a[2]}).` : a[1] < 0 ? `That did not land (${a[2]}).` : `Noted (${a[2]}).`, a[1] < 0); renderDraft(); },
  cdraftnight: () => confirmBox('Go to draft night?', 'Your workouts and interviews are done once the draft starts.', 'Draft Night', () => draftNight()),
  cdnskip: () => { clearTimeout(CUI.dn.timer); const D = Cc().draft, i = D.picks.findIndex(p => p.pid === 'ME'); CUI.dn.i = i >= 0 ? i : D.picks.length - 1; CUI.dn.fast = true; CUI.dn.timer = setTimeout(() => { CUI.dn.i = Math.max(0, CUI.dn.i); const tickOnce = () => { CUI.dn.i++; render('career', CUI.dn.html()); const now = D.picks[CUI.dn.i - 1]; if (now && now.pid === 'ME') { SFX.cheer(1.6); SFX.jingle(); confettiDom(D.pro.teams[now.tid]); RH.VOICE.say(`With the ${ordinal(now.n)} pick, the ${D.pro.teams[now.tid].city} ${D.pro.teams[now.tid].name} select ${Cc().me.first} ${Cc().me.last}!`, { prio: 3 }); } }; tickOnce(); }, 50); },
  cdnfinish: () => { clearTimeout(CUI.dn && CUI.dn.timer); RH.enterPros(); CUI.view = null; CUI.tab = 'home'; SFX.jingle(); renderCareer(); const c = Cc(), t = RH.myTeam(); modal(`<h3>WELCOME TO THE ${esc(t.name.toUpperCase())}</h3>${coachSays(`The pros. 24-second clock, the deepest three-point line, and every night the best players in the world. You start as ${RH.roleOf().name.toLowerCase()}. ${c.rival ? `And everybody is already comparing you to ${c.rival.name}.` : ''}`)}<div class="row end"><button class="btn primary" data-act="close">Let's Go</button></div>`, 'sm'); },
  cfa: () => renderFA(),
  cfasign: el => { const o = CUI.fa.offers[+el.dataset.i]; RH.signContract(o); Cc().contract.fresh = true; CUI.fa = null; ACT.cnextyear(); },
  cretire: () => confirmBox('Retire?', 'Hang up the sneakers and see your legacy. This ends your career.', 'Retire', () => { const c = Cc(); c.retired = true; RH.saveC(); renderRetired(); }, true),
  cretired: () => renderRetired(),
  cnewcareer: () => confirmBox('Start a new career?', 'This deletes your current career.', 'New Career', () => { RH.wipeCareer(); startCreator(); }, true)
});

/* ---------- title screen entry ---------- */
const _renderTitle = renderTitle;
renderTitle = function () { // eslint-disable-line no-func-assign
  _renderTitle();
  const row = document.querySelector('#title .title-box .row'); if (!row) return;
  const b = document.createElement('button'); b.className = 'btn ' + (RH.hasCareer() ? 'primary' : ''); b.dataset.act = 'career'; b.textContent = RH.hasCareer() ? 'Continue Career' : 'Career Mode';
  row.insertBefore(b, row.firstChild);
  const p = document.querySelector('#title .title-box p.muted'); if (p) p.textContent = 'Five-on-five pixel basketball. Run a franchise, play friends online, or build one player from freshman year to the pros.';
};
RH.careerEnter = careerEnter; RH.CUI = CUI;

RH.boot();
</script>
